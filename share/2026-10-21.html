<title>每日靈修 10/21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--ink:#2b2622;--muted:#8a7f74;--line:#e8e1d7;--accent:#9a5b2e;
--accent-bg:#fbf1e7;--warn:#a1442b;--warn-bg:#fdecea;--bar:#eadfce}
@media (prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#252220;--ink:#ece6df;--muted:#a39888;
--line:#38332e;--accent:#e0a36f;--accent-bg:#2e2620;--warn:#f0907a;--warn-bg:#3a2522;--bar:#3a332c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 "Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{padding:12px 4px 18px}
.hello{margin:0;color:var(--muted);font-size:15px}
h1{margin:2px 0 0;font:600 26px/1.3 "Noto Serif TC",serif}
h1 small{font-size:16px;color:var(--muted);margin-left:8px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;margin:0 0 14px}
.card.accent{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.card.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
h2 .ic{font-size:20px}
h3{margin:18px 0 6px;font-size:16px}
.point h3{color:var(--accent)}
p{margin:0 0 10px}
.big{font:600 20px/1.5 "Noto Serif TC",serif}
.ref{margin:0 0 6px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.tag{display:inline-block;margin:0 0 10px;padding:2px 10px;border-radius:99px;background:var(--accent-bg);color:var(--accent);font-size:14px}
.muted{color:var(--muted);font-size:14px}
blockquote.scripture{margin:4px 0 14px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-bg);
border-radius:0 10px 10px 0;font:19px/1.9 "Noto Serif TC",serif}
.progress{margin:6px 0 12px}
.bar{height:6px;border-radius:99px;background:var(--bar);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.plabel{margin-top:4px;font-size:13px;color:var(--muted)}
ol.questions{margin:0;padding-left:1.4em}ol.questions li{margin-bottom:10px}
.prayer p{font-family:"Noto Serif TC",serif}
ol.chunks{list-style:none;margin:0;padding:0;counter-reset:c}
ol.chunks li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:0 6px;padding:8px 0;border-top:1px dashed var(--line)}
ol.chunks li:first-child{border-top:0}
ol.chunks li::before{content:counter(c);grid-row:span 2;width:22px;height:22px;margin-top:4px;border-radius:50%;
background:var(--accent);color:var(--card);font-size:13px;display:grid;place-items:center}
.chunk{font:600 17px/1.6 "Noto Serif TC",serif}.img{color:var(--muted);font-size:15px}
.codes{font-size:14px;color:var(--accent);background:var(--accent-bg);padding:6px 10px;border-radius:8px}
details.hint{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
details.hint summary{cursor:pointer;list-style:none;letter-spacing:.08em;word-break:break-all}
details.hint summary::-webkit-details-marker{display:none}
details.hint[open]{background:var(--accent-bg);border-color:transparent}
.answer{margin:8px 0 0;font:17px/1.8 "Noto Serif TC",serif;letter-spacing:0}
.vn{display:inline-block;min-width:1.6em;color:var(--accent);font-weight:600;letter-spacing:0}
.rref{display:block;font-weight:600;color:var(--accent);letter-spacing:0;margin-bottom:2px}
.rref small{color:var(--muted);font-weight:400;margin-left:8px}
ul.events{list-style:none;margin:0;padding:0}
ul.events li{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
ul.events li:first-child{border-top:0}
.when{flex:0 0 auto;min-width:4.2em;color:var(--accent);font-variant-numeric:tabular-nums}
.loc{display:block;color:var(--muted);font-size:14px}
.empty{color:var(--muted)}
.notice{text-align:center;color:var(--muted);padding:60px 16px}
details.chapter{border-top:1px solid var(--line)}
details.chapter summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none;display:flex;align-items:baseline;gap:8px}
details.chapter summary::-webkit-details-marker{display:none}
details.chapter summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.chapter[open] summary::before{transform:rotate(90deg)}
details.chapter summary small{color:var(--muted);font-weight:400;font-size:13px}
.bible{padding:0 2px 14px;font:18px/2 "Noto Serif TC",serif}
.bible .v sup{color:var(--accent);font:600 11px/1 "Noto Sans TC",sans-serif;margin:0 3px 0 6px}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--card);
font:600 15px/1 inherit;cursor:pointer}
.share-url{font-size:13px;word-break:break-all;color:var(--muted);background:var(--accent-bg);padding:8px 10px;border-radius:8px}
.install{font-size:14px;color:var(--muted);text-align:center;border-style:dashed}
footer{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:8px 0 4px}
footer a{color:inherit}
.bible .v.mark{background:var(--accent-bg);box-shadow:0 0 0 3px var(--accent-bg);border-radius:4px}
</style></head>

<script>
const DATE="2026-10-21";
const app=document.getElementById('app');
const fail=m=>{app.innerHTML='<p class="notice">'+m+'</p>'};
const storeKey='brief-key:'+location.pathname.replace(/[^/]*$/,'');
const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);
  return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
function installHint(){
  if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)return;
  const ua=navigator.userAgent, el=document.createElement('section');
  el.className='card install';
  el.innerHTML=/Line\//i.test(ua)?'📱 想把早報變成 App？點右上角「⋯」→「用預設瀏覽器開啟」，再加入主畫面。'
    :/iPhone|iPad/.test(ua)?'📱 加到主畫面：點下方分享按鈕 →「加入主畫面」，以後點圖示就能看當天的內容。'
    :'📱 加到主畫面：點瀏覽器選單 →「加到主畫面」，以後點圖示就能看當天的內容。';
  app.insertBefore(el,app.querySelector('footer'));
}
(async()=>{
  let k=(location.hash.match(/k=([A-Za-z0-9_-]+)/)||[])[1];
  try{if(k)localStorage.setItem(storeKey,k);else k=localStorage.getItem(storeKey)}catch(e){}
  if(!k)return fail('請從 LINE 傳來的連結開啟。');
  try{
    const data=b64(document.getElementById('payload').textContent.trim());
    const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},key,data.slice(12));
    app.innerHTML=new TextDecoder().decode(plain);
  }catch(e){return fail('無法開啟，連結可能不完整或已失效。請從 LINE 重新點一次連結。')}
  // 網址換成「最新一天」的固定網址，加入主畫面時存的就是它
  history.replaceState(null,'','./#k='+k);
  installHint();
})();
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent='已複製 ✓'});
});
// App 從背景切回來時，如果已經有新的一天就自動換過去
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible')return;
  try{const j=await (await fetch('latest.json?t='+Date.now(),{cache:'no-store'})).json();
    if(j.date!==DATE)location.replace(j.file+location.hash)}catch(e){}
});
</script></body></html>
